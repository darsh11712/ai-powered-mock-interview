{% extends 'base.html' %}
{% block content %}
<div class="container d-flex justify-content-center mt-5">
    <div class="card shadow p-4" style="max-width: 420px; width: 100%;">
        <h3 class="text-center mb-3">Student Registration</h3>

        <form method="post">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input name="name" class="form-control" placeholder="Enter your name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Subject</label>
                <input name="subject" class="form-control" placeholder="Enter your subject" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Create password" required>
            </div>

            <button type="submit" class="btn btn-success w-100 mt-2">Register</button>
        </form>

        <div class="text-center mt-3">
            <a href="/login" class="btn btn-outline-secondary w-100">Already Registered?</a>
        </div>

    </div>
</div>
{% endblock %}
