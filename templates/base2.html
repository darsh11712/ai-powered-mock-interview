<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mock Interview Portal</title>

    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e9f0ff, #f9fbff);
            color: #333;
        }

        /* ---------------- NAVBAR ---------------- */
        nav {
            background: linear-gradient(135deg, #003d99, #005fcc);
            padding: 15px 40px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
        }

        nav .logo {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-weight: 500;
            padding: 6px 10px;
            border-radius: 6px;
            transition: 0.3s ease;
        }

        nav a:hover {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
        }

        /* ---------------- CONTAINER ---------------- */
        .container {
            max-width: 1150px;
            margin: 35px auto;
            padding: 20px;
        }

        /* ---------------- CARD ---------------- */
        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
            transition: 0.3s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
        }

        /* ---------------- FORMS ---------------- */
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
            transition: 0.25s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #0066cc;
            box-shadow: 0 0 6px rgba(0, 102, 204, 0.35);
        }

        textarea {
            resize: vertical;
        }

        /* ---------------- BUTTON ---------------- */
        button {
            background-color: #005fcc;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s ease;
        }

        button:hover {
            background-color: #004799;
        }

        /* ---------------- MEDIA ---------------- */
        img, video {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        }

        /* ---------------- TABLE ---------------- */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin: 20px 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        th {
            background: #0052b3;
            color: white;
            padding: 14px;
            font-size: 15px;
            letter-spacing: 0.4px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        tr:hover td {
            background: #f1f5ff;
        }

        /* ---------------- QUESTION BLOCK ---------------- */
        .question-block {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 12px;
            border: 1px solid #ddd;
            box-shadow: 0 3px 8px rgba(0,0,0,0.08);
        }

        .question-block h4 {
            margin-bottom: 12px;
            font-weight: 600;
        }

        .option {
            margin: 8px 0;
            font-size: 15px;
        }

        .result-correct {
            color: #008c2e;
            font-weight: 600;
        }

        .result-wrong {
            color: #d30000;
            font-weight: 600;
        }

        .result-section {
            background: white;
            padding: 24px;
            border-radius: 12px;
            border: 2px dashed #bfbfbf;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .result-summary {
            font-size: 20px;
            font-weight: 600;
        }

    </style>
</head>

<body>

    <nav>
        <div class="logo">Mock Interview Portal</div>
        <div>
            <a href="/student/recording">Take Interview</a>
            <a href="/">Logout</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
